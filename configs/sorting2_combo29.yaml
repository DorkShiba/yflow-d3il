schema_version: 4
task: sorting_2
device: cpu
paths:
  run_dir: fm_baseline/results/sorting2_baseline
  output_root: fm_constraint/runs
  data_root: data
  d3il_root: ../d3il
  raw_root: data/raw/sorting
  contexts_file: fm_baseline/results/sorting2_baseline/id_contexts.pkl
  ood_root: data/ood
model:
  horizon: 16
  dim: 64
  dim_mults:
  - 1
  - 2
  - 4
  - 8
  attention: false
  sn: false
  sn_skip_output: false
train:
  steps: 1000000
  batch_size: 32
  lr: 0.0002
  scheduler: cosine
  ema_decay: 0.995
  seed: 42
  log_every: 5000
  save_every: 25000
  val_batches: 8
  val_seed: 1234
  time_limit_hours: 0.0
  tag: constraint
  resume: null
sample:
  n_windows: 256
  batch_size: 64
  split: val
  seed: 0
  no_save: true
eval:
  checkpoint: baseline_ema.pt
  weights: ema
  execute_steps: 8
  max_steps: 500
  n_contexts: 100
  n_traj: 4
  seed: 0
  check_obs: 0
  export_contexts: null
  ood: null
  contexts: test
control:
  dt_s: 0.035
sampling:
  predict_steps: 10
methods:
  projection:
    enabled: true
    mode: every
    skip_first: 0
  pf2mp:
    enabled: true
    weight: 0.01
    bandwidth_m: 0.025
    distance_alpha: -1.0
    max_support: 3000
    seed: 42
    grid_step_m: 0.01
    grid_padding_m: 0.15
    density_quantile: 0.05
    query_chunk_size: 128
    lock_timeout_s: 600.0
  filter:
    enabled: true
  rtc:
    enabled: false
    beta: 5.0
  lipo:
    enabled: true
    bound_m: 0.0003
constraints:
  workspace:
    enabled: true
    geometry: rectangle
    source: research_bounds
    low_m:
    - 0.22999999999999998
    - -0.36
    high_m:
    - 0.81
    - 0.46
    margin_m: 0.01
  acceleration:
    enabled: true
    max_m_s2: 14.7
    approximation: inscribed_polygon
    polygon_sides: 32
  object_envelope:
    enabled: true
    geometry: regular_polygon
    n_sides: 8
    normal_offset_rad: 0.0
    center: mean_blocks
    include: all_blocks
    footprint: centers
    margin_m: 0.41
    update: per_plan
    auto_expand: false
solver:
  formulation: linear_inequality_qp
  backend: osqp
  dtype: float64
  feasibility_tolerance_m: 1.0e-07
  intervention_tolerance_m: 1.0e-07
  eps_abs: 1.0e-09
  eps_rel: 1.0e-09
  max_iter: 20000
  on_failure: abort_episode
