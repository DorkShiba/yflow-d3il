# 가속도·물체 margin은 results의 학습 시연 통계에서 선정한 고정값이다.
task: pushing
device: cpu
paths:
  run_dir: fm_baseline/results/pushing_baseline
  output_root: fm_constraint/runs
  data_root: data
  d3il_root: ../d3il
  raw_root: /root/d3il-work/raw/pushing/all_data
  contexts_file: fm_baseline/contexts/inserting_val.pkl
model:
  horizon: 16
  dim: 32
  dim_mults:
  - 1
  - 4
  - 8
  attention: false
  sn: false
  sn_skip_output: false
train:
  steps: 1000000
  batch_size: 32
  lr: 0.0002
  scheduler: cosine
  ema_decay: 0.995
  seed: 42
  log_every: 5000
  save_every: 25000
  val_batches: 8
  val_seed: 1234
  time_limit_hours: 0.0
  tag: constraint
  resume: null
sample:
  n_windows: 256
  batch_size: 64
  split: val
  seed: 0
  no_save: true
eval:
  checkpoint: baseline_ema.pt
  weights: ema
  execute_steps: 8
  max_steps: 400
  n_contexts: 30
  n_traj: 4
  seed: 0
  check_obs: 0
  export_contexts: null
  contexts: test
schema_version: 4
control:
  dt_s: 0.035
sampling:
  predict_steps: 10
methods:
  # ①~⑤ 독립 on/off. 실행 순서(고정): Predict 내부 FM(+④ RTC)+② PF2MP → Euler → ① Projection,
  # 계획 끝 ⑤ LiPo(①이 켜져 있으면 ① 제약 포함), 실행 직전 ③ filter.
  projection:
    enabled: false
    mode: every
    skip_first: 0
  pf2mp:
    enabled: false
    # 초기 후보값이며 D3IL 성능을 검증한 확정값이 아니다.
    weight: 0.01
    bandwidth_m: 0.025
    distance_alpha: -1.0
    max_support: 3000
    seed: 42
    grid_step_m: 0.01
    grid_padding_m: 0.15
    density_quantile: 0.05
    query_chunk_size: 128
    lock_timeout_s: 600.0
  filter:
    enabled: false
  rtc:
    enabled: false
    beta: 5.0
  lipo:
    enabled: false
    bound_m: 0.0003
constraints:
  workspace:
    enabled: true
    geometry: rectangle
    source: research_bounds
    low_m:
    - 0.2
    - -0.4
    high_m:
    - 0.85
    - 0.5
    margin_m: 0.01
  acceleration:
    enabled: true
    max_m_s2: 13.7
    approximation: inscribed_polygon
    polygon_sides: 32
  object_envelope:
    enabled: true
    geometry: regular_polygon
    n_sides: 8
    normal_offset_rad: 0.0
    center: mean_blocks
    include: all_blocks
    footprint: centers
    margin_m: 0.25
    update: per_plan
    auto_expand: false
solver:
  formulation: linear_inequality_qp
  backend: osqp
  dtype: float64
  feasibility_tolerance_m: 1.0e-07
  intervention_tolerance_m: 1.0e-07
  eps_abs: 1.0e-09
  eps_rel: 1.0e-09
  max_iter: 20000
  on_failure: abort_episode
