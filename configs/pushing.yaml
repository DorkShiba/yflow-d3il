# 가속도·물체 margin은 results의 학습 시연 통계에서 선정한 고정값이다.
task: pushing
device: cpu
paths:
  run_dir: fm_baseline/results/pushing_baseline
  output_root: fm_constraint/runs
  data_root: data
  hardflow_root: ../HardFlow
  d3il_root: ../d3il
  raw_root: /root/d3il-work/raw/pushing/all_data
  contexts_file: fm_baseline/contexts/inserting_val.pkl
model:
  horizon: 16
  dim: 32
  dim_mults:
  - 1
  - 4
  - 8
  attention: false
  sn: false
  sn_skip_output: false
train:
  steps: 1000000
  batch_size: 32
  lr: 0.0002
  scheduler: cosine
  ema_decay: 0.995
  seed: 42
  log_every: 5000
  save_every: 25000
  val_batches: 8
  val_seed: 1234
  time_limit_hours: 0.0
  tag: constraint
  resume: null
sample:
  n_windows: 256
  batch_size: 64
  split: val
  seed: 0
  no_save: true
eval:
  checkpoint: baseline_ema.pt
  weights: ema
  execute_steps: 8
  max_steps: 400
  n_contexts: 30
  n_traj: 4
  seed: 0
  check_obs: 0
  export_contexts: null
  contexts: test
schema_version: 2
control:
  dt_s: 0.035
sampling:
  predict_steps: 10
methods:
  # 고정 순서: Predict 내부 Projection → PC → 최종 계획 VLSA.
  projection:
    enabled: false
    mode: every
    scope: predict
    skip_first: 0
  pc:
    enabled: false
    correct_steps: 9
    alpha: 2.0
    rho: 0.9
    delta: 0.01
    eps: auto
  vlsa:
    enabled: false
    scope: terminal_plan
    execution_recheck: false
    invalidate_queue_on_change: true
constraints:
  workspace:
    enabled: true
    geometry: rectangle
    source: research_bounds
    low_m:
    - 0.2
    - -0.4
    high_m:
    - 0.85
    - 0.5
    margin_m: 0.01
  acceleration:
    enabled: true
    max_m_s2: 13.7
    approximation: inscribed_polygon
    polygon_sides: 32
  object_envelope:
    enabled: true
    geometry: regular_polygon
    n_sides: 8
    normal_offset_rad: 0.0
    center: mean_blocks
    include: all_blocks
    footprint: centers
    margin_m: 0.25
    update: per_plan
    auto_expand: false
solver:
  formulation: linear_inequality_qp
  backend: osqp
  dtype: float64
  feasibility_tolerance_m: 1.0e-07
  intervention_tolerance_m: 1.0e-07
  eps_abs: 1.0e-09
  eps_rel: 1.0e-09
  max_iter: 20000
  on_failure: abort_episode
